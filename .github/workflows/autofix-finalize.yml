name: Finalize auto-fix pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-finalize-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const eventPull = context.payload.pull_request || context.payload.check_suite?.pull_requests?.[0];
            if (!eventPull) {
              core.info('No pull request for this event.');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: eventPull.number,
            });
            if (pull.state !== 'open' || pull.base.ref !== 'staging' || !pull.head.ref.startsWith('autofix/staging/')) {
              core.info('Not an open staging auto-fix pull request.');
              return;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.head.sha,
              per_page: 100,
            });
            if (checks.check_runs.some((check) => check.status !== 'completed')) {
              core.info('Checks still running.');
              return;
            }
            const failed = checks.check_runs.filter((check) => !['success', 'neutral', 'skipped'].includes(check.conclusion));
            if (failed.length) {
              core.warning(`Closing failed auto-fix PR: ${failed.map((check) => check.name).join(', ')}`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: 'closed',
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${pull.head.ref}`,
                });
              } catch (error) {
                core.warning(`Could not delete ${pull.head.ref}: ${error.message}`);
              }
              return;
            }

            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                merge_method: 'squash',
                commit_title: `chore: auto-fix lint and formatting (#${pull.number})`,
              });
              if (!result.data.merged) throw new Error(result.data.message);
            } catch (error) {
              core.warning(`Auto-merge unavailable: ${error.message}`);
            }
