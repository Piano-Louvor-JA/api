# AI Review — chama o workflow reusable da org (fonte de verdade: Piano-Louvor-JA/.github)
name: AI Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

# O reusable precisa destas permissões (comentar na PR) — o chamador é quem concede
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    uses: Piano-Louvor-JA/.github/.github/workflows/ai-review-reusable.yml@main
    secrets: inherit
