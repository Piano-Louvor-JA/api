# CI Pipeline - pianolouvorja/api
# Camadas: lint -> typecheck -> test -> build -> quality-gate
# Padrao da org: gates encadeados, npm cacheado, quality-gate final
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  # Camada 1: Lint + Format (< 15s) — fast feedback
  # ubuntu-24.04 fixo: ubuntu-latest não recebia runner hospedado
  # (run 37365233813). O label migra para Ubuntu 26 em 19/10/2026.
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci src/ test/

  # Camada 2: Type Check (< 30s) — depende de lint
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Camada 3: Tests + Coverage (< 1min) — depende de typecheck
  test:
    name: Tests + Coverage
    runs-on: ubuntu-24.04
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p data
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # Camada 4: Docker Build (< 2min) — depende de test
  build:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: piano-api:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: piano-api:smoke
          load: true
          # load:true incompatível com attestations default do buildx
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and check /v1/health
        run: |
          docker run -d --rm --name smoke -p 3100:3100 \
            -e NODE_ENV=production \
            -e PORT=3100 \
            -e DB_PATH=/app/data/catalog.db \
            -e MEDIA_DIR=/app/media \
            -e PALCO_RELAY_KEY=smoke-test-key \
            piano-api:smoke
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/v1/health > /dev/null 2>&1; then
              echo "✅ health check OK"
              docker stop smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::/v1/health não respondeu em 40s"
          docker logs smoke
          docker stop smoke || true
          exit 1

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Camada 4.5: Regression Gate (anti-regressão) — baseline staging vs PR
  regression-gate:
    name: Regression Gate (anti-regressão)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p data
      - name: Baseline (staging)
        run: |
          # O script ainda não existe na staging neste PR. Copia antes do checkout.
          cp scripts/test-regression.mjs /tmp/test-regression.mjs
          git checkout staging
          node /tmp/test-regression.mjs --baseline
          git checkout "${{ github.head_ref }}"
      - name: Compare (PR branch)
        run: npm run test:regression -- --compare

  # Quality Gate: so passa se TODAS as camadas passaram
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, build, smoke, audit, regression-gate]
    # Não pede runner de novo quando um job anterior foi cancelado
    # (runner hospedado não atribuído). Sem isso o gate espera mais 15 min.
    if: >-
      always() &&
      needs.lint.result != 'cancelled' &&
      needs.typecheck.result != 'cancelled' &&
      needs.test.result != 'cancelled' &&
      needs.build.result != 'cancelled' &&
      needs.smoke.result != 'cancelled' &&
      needs.audit.result != 'cancelled' &&
      needs.regression-gate.result != 'cancelled'
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "regression-gate: ${{ needs.regression-gate.result }}"
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.smoke.result }}" != "success" || "${{ needs.audit.result }}" != "success" ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          # regression-gate roda só em PR; em push fica skipped e não bloqueia
          if [[ "${{ needs.regression-gate.result }}" == "failure" ]]; then
            echo "::error::Regression Gate FALHOU — detectada regressão vs staging"
            exit 1
          fi
          echo "Quality Gate PASSOU"
