# Security jobs — copiar para .github/workflows/security.yml do repo
# Bloqueia PR com: segredo no diff, dependência vuln high+, [EXTRA] semgrep SAST
name: security
on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  secrets:
    name: gitleaks (segredos no diff/histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # CLI open source. A action oficial (gitleaks-action@v2) passou a exigir
      # licença paga (GITLEAKS_LICENSE) e quebrava todo PR.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            "$RUNNER_TEMP/gitleaks" detect --source . --redact
          fi

  dependencies:
    name: npm audit (high+ bloqueia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install --no-save
      - run: npm audit --audit-level=high

  sast:
    name: semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Só src/ e só severidade ERROR. `auto` no repo inteiro marcava tag
      # @v4, dependabot e scripts como bloqueio (44 findings, zero CVE).
      # ws:// em remote.routes é protocolo de LAN de propósito.
      - run: |
          semgrep scan --config p/javascript --config p/typescript \
            --severity ERROR --error \
            --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
            src
