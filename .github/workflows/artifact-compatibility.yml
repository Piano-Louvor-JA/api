name: Artifact compatibility

on:
  pull_request:
    branches: [staging, main]
    paths:
      - .github/workflows/autofix.yml
      - .github/workflows/artifact-compatibility.yml

permissions:
  contents: read

jobs:
  roundtrip:
    name: Artifact upload/download roundtrip
    runs-on: ubuntu-latest
    steps:
      - name: Create sample patch
        run: echo 'artifact compatibility fixture' > autofix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: autofix-patch
          path: autofix.patch
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: autofix-patch
          path: downloaded
      - name: Verify downloaded patch
        run: cmp autofix.patch downloaded/autofix.patch
