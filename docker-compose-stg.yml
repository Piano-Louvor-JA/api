services:
  api:
    build: /opt/services/api-piano-louvorja
    container_name: piano-api-stg
    restart: unless-stopped
    expose:
      - "3101"
    networks:
      - proxy
    volumes:
      - ./data:/app/data
      - ./media:/app/media:ro
      - ./media_community:/app/media_community:ro
      - /opt/services/api-piano-louvorja/media/covers/es:/app/media/covers/es
      - /opt/services/api-piano-louvorja/media/images/es:/app/media/images/es
    env_file:
      - .env

networks:
  proxy:
    external: true
